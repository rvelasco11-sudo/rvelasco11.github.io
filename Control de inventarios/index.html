<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Inventario</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="toast-container" class="toast-container"></div>

    <div class="form-container">
        <h2>Agregar Producto</h2>
        <form id="product-form">
            <div class="form-group">
                <label for="codigo">Código del Producto:</label>
                <input type="text" id="codigo" required placeholder="Ej: PRD-001">
            </div>
            <div class="form-group">
                <label for="nombre">Nombre del Producto:</label>
                <input type="text" id="nombre" required placeholder="Ej: Laptop">
            </div>
            <div class="form-group">
                <label for="marca">Marca:</label>
                <input type="text" id="marca" required placeholder="Ej: Dell">
            </div>
            <div class="form-group">
                <label for="cantidad">Cantidad:</label>
                <input type="number" id="cantidad" min="1" required placeholder="Ej: 10">
            </div>
            <div class="form-group">
                <label for="costo">Costo ($):</label>
                <input type="number" id="costo" min="0.01" step="0.01" required placeholder="Ej: 850.50">
            </div>
            <button type="submit">Agregar al Inventario</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
